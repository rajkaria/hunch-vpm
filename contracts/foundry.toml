[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
# the vector replay is one long test: lift the per-test gas and memory ceilings
gas_limit = "18446744073709551615"
memory_limit = 268435456
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  { access = "write", path = "./GAS.md" },
]
gas_reports = ["VestedParimutuel", "NaiveVestedParimutuel"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api", chain = 5042002 }

# The vendored reference implementation and its suite must stay byte-for-byte
# identical to what was published with the paper — the formatter never touches them.
[fmt]
ignore = [
  "src/VestedParimutuel.sol",
  "src/NaiveVestedParimutuel.sol",
  "src/mocks/MockERC20.sol",
  "test/Vectors.t.sol",
  "test/Mechanism.t.sol",
  "test/Gas.t.sol",
]
